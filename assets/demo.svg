<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
  <defs>
    <style>
      .bg{fill:#0d1117}
      .win{fill:#161b22;stroke:#2a3240;stroke-width:1}
      .bar{fill:#1c2230}
      .t{fill:#e6edf3;font-size:15px}
      .dim{fill:#8b97a4;font-size:15px}
      .grn{fill:#4dd0a7;font-size:15px}
      .cmd{fill:#6cb6ff;font-size:15px}
      .warn{fill:#e0a458;font-size:15px}
      .cap{fill:#9aa7b4;font-size:13.5px;font-family:-apple-system,Segoe UI,Roboto,sans-serif}
      .capb{fill:#e6edf3;font-size:13.5px;font-family:-apple-system,Segoe UI,Roboto,sans-serif;font-weight:600}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="940" height="430" rx="12"/>
  <rect class="win" x="20" y="20" width="900" height="320" rx="10"/>
  <rect class="bar" x="20" y="20" width="900" height="34" rx="10"/>
  <rect class="bar" x="20" y="40" width="900" height="14"/>
  <circle cx="42" cy="37" r="5.5" fill="#e06c75"/>
  <circle cx="62" cy="37" r="5.5" fill="#e0a458"/>
  <circle cx="82" cy="37" r="5.5" fill="#4dd0a7"/>
  <text x="470" y="42" text-anchor="middle" class="dim" font-size="12.5">thread-sweep — your repo, your topics</text>

  <text x="42" y="86"  class="cmd">$ python thread_sweep.py scan --days 30</text>
  <text x="42" y="116" class="grn">THREAD_SWEEP_OK</text><text x="190" y="116" class="t">window&gt;2026-05-31  raw=226 kept=36</text>
  <text x="42" y="140" class="dim">dropped = { seen:37, stars:117, repo_cap:36 }   already-answered: excluded forever</text>
  <text x="42" y="168" class="t">fit tiers: </text><text x="148" y="168" class="grn">8 high</text><text x="222" y="168" class="t"> / 28 med / 0 low</text>
  <text x="42" y="192" class="warn">posting density: 0 in 30d / 0 in 90d</text><text x="372" y="192" class="dim">restraint stays visible</text>
  <text x="42" y="220" class="t">candidates -&gt; candidates.json</text>
  <text x="42" y="252" class="dim"># the scanner does recall. you do precision:</text>
  <text x="42" y="276" class="dim"># read the shortlist, draft the few worth posting, approve each one.</text>
  <text x="42" y="300" class="cmd">$ </text><text x="62" y="300" class="t">python thread_sweep.py mark-posted --url … --comment-file reply.md</text>

  <text x="34" y="378" class="capb">Code finds the threads.</text>
  <text x="218" y="378" class="cap">You decide which deserve a reply. Nothing posts without your approval.</text>
  <text x="34" y="402" class="cap">A ledger guarantees no thread is ever answered twice.</text>
</svg>
