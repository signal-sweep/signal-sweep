name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned on purpose: ruff's lint/format defaults move between releases,
      # and an unpinned install can turn CI red with no code change. Bump the
      # pin deliberately in its own commit.
      - run: pip install ruff==0.15.21
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.10 is the advertised floor (README badge + module docstrings);
        # the newest stable catches deprecations early.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # Each module is a standalone (non-package) directory, so a single
      # top-level `unittest discover` would only find modules/test_sweepcore.py
      # and skip every per-module suite. run_tests.py discovers each directory
      # in its own subprocess so all suites gate the PR.
      - run: python modules/run_tests.py
