<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#10171d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4dd0a7"/>
      <stop offset="1" stop-color="#6cb6ff"/>
    </linearGradient>
    <style>
      .mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
      .sans{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
    </style>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#accent)"/>

  <!-- faint scan-line motif -->
  <g opacity="0.06" stroke="#4dd0a7" stroke-width="2">
    <line x1="820" y1="120" x2="1180" y2="120"/>
    <line x1="820" y1="160" x2="1120" y2="160"/>
    <line x1="820" y1="200" x2="1180" y2="200"/>
    <line x1="820" y1="240" x2="1060" y2="240"/>
    <line x1="820" y1="280" x2="1180" y2="280"/>
  </g>

  <text x="90" y="150" class="mono" font-size="34" fill="#6b7785">~/signal-sweep</text>
  <text x="86" y="248" class="mono" font-size="78" font-weight="700" fill="#e6edf3">signal-sweep</text>

  <text x="90" y="332" class="sans" font-size="34" fill="#cdd6e0" font-weight="600">Find the GitHub threads your docs already answer.</text>
  <text x="90" y="380" class="sans" font-size="34" fill="#cdd6e0" font-weight="600">Answer them one at a time, on your terms.</text>

  <!-- gate badge -->
  <rect x="90" y="430" width="560" height="58" rx="29" fill="#15211d" stroke="#2a5a4c" stroke-width="1.5"/>
  <circle cx="126" cy="459" r="9" fill="none" stroke="#4dd0a7" stroke-width="2.5"/>
  <path d="M121 459 l4 4 l7 -8" fill="none" stroke="#4dd0a7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="152" y="468" class="sans" font-size="25" fill="#74e4bf" font-weight="600">The gate is the feature — nothing posts unapproved</text>

  <text x="90" y="566" class="mono" font-size="23" fill="#6b7785">Deterministic discovery · human judgment · a ledger so nothing doubles up</text>
  <text x="90" y="600" class="mono" font-size="20" fill="#566372">MIT · Python · stdlib + gh · James Ross &amp; Justin Zingsheim</text>
</svg>
