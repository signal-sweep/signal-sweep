# Explicit lint config (audit findings 5df915c6 + a2ff9494): CI previously ran
# ruff's bare defaults, so every ruff release could silently change what was
# linted -- the 0.15->0.16 default-widening turned 102 findings on with zero
# code change. An explicit select makes the pin bumpable safely.
target-version = "py310"

[lint]
# The widest set this codebase is verified clean under (2026-08-27):
# pycodestyle + pyflakes + isort + bugbear + pyupgrade.
select = ["E", "W", "F", "I", "B", "UP"]
# Line length is the formatter's job; E501 residuals are strings/URLs the
# formatter deliberately leaves alone.
ignore = ["E501"]
